name: factory-tick

on:
  schedule:
    - cron: '0 14 * * 1-5' # 14:00 UTC weekdays; the tick is idempotent, so cadence is a policy knob
  workflow_dispatch:
    inputs:
      worker:
        description: 'Override worker.kind for this run (blank = as configured)'
        type: choice
        options: ['', 'cursor', 'claude-code']
        default: ''

concurrency:
  group: factory
  cancel-in-progress: false

# The tick appends to the record on the `telemetry` branch; without this the
# default GITHUB_TOKEN is read-only and the persist step fails after the work
# is done. Main is never pushed to: the org ruleset requires a PR there, and
# nothing the tick decides depends on the record anyway (see outcomes.ts).
permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      # The tick needs a committed factory.config.json; without one the
      # schedule is a no-op.
      - name: Read worker kind
        id: kind
        if: hashFiles('factory.config.json') != ''
        run: echo "claude=$([[ "$(jq -r '.worker.kind // "cursor"' factory.config.json)" == claude-code ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # The record lives on the `telemetry` branch, one append-only file. Fetch
      # what is there so this tick's rows land after it; a missing branch means
      # the record starts here.
      - name: Fetch telemetry
        if: hashFiles('factory.config.json') != ''
        run: |
          mkdir -p telemetry
          if git fetch -q origin telemetry 2>/dev/null; then
            git show origin/telemetry:telemetry/runs.jsonl > telemetry/runs.jsonl
            echo "record has $(wc -l < telemetry/runs.jsonl) row(s)"
          else
            echo "no telemetry branch yet; starting the record"
          fi
      # The claude-code worker runs its agents on this runner, so it needs the
      # CLI here. Installed only when this run will use it.
      - name: Install Claude Code
        if: hashFiles('factory.config.json') != '' && (inputs.worker == 'claude-code' || (inputs.worker == '' && fromJSON(steps.kind.outputs.claude)))
        run: npm install -g @anthropic-ai/claude-code
      - if: hashFiles('factory.config.json') != ''
        run: npm run factory -- run
        env:
          FACTORY_WORKER: ${{ inputs.worker }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Subscription token from `claude setup-token`, for the claude-code
          # worker. Tied to the seat of whoever generated it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT with repo scope on the target repo; the default GITHUB_TOKEN
          # is scoped to this repo and cannot label/PR the target repo. The
          # claude-code worker's agents push and open PRs with it too.
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          # Credentials handed to the coding agents (worker.agentEnv in
          # factory.config.json). Cursor agents get them as session env vars;
          # claude-code agents inherit them from this step. One unset here is
          # logged and left out, never an error. Add one line per name, e.g.
          # MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      # Append this tick's rows to the record. Only the tick writes to this
      # branch, so a rejected push means another tick beat us to it: refetch
      # and replay the new rows onto whatever is there now. The branch is
      # handled in a worktree so the main checkout, and the credentials
      # actions/checkout put in its config, are left alone.
      - name: Persist telemetry
        if: hashFiles('factory.config.json') != ''
        run: |
          [[ -f telemetry/runs.jsonl ]] || exit 0
          base_rows=$(git show origin/telemetry:telemetry/runs.jsonl 2>/dev/null | wc -l)
          tail -n +"$((base_rows + 1))" telemetry/runs.jsonl > "$RUNNER_TEMP/new-rows.jsonl"
          if [[ ! -s "$RUNNER_TEMP/new-rows.jsonl" ]]; then
            echo "no new telemetry rows"; exit 0
          fi
          echo "persisting $(wc -l < "$RUNNER_TEMP/new-rows.jsonl") telemetry row(s)"
          git config user.name "conveyor"
          git config user.email "conveyor@users.noreply.github.com"

          record="$RUNNER_TEMP/record"
          for attempt in 1 2 3 4 5; do
            rm -rf "$record"; git worktree prune
            if git fetch -q origin telemetry 2>/dev/null; then
              git worktree add -q --detach "$record" origin/telemetry
            else
              # No record yet: start the branch with this tick's rows.
              git worktree add -q --detach "$record" HEAD
              git -C "$record" checkout -q --orphan telemetry
              git -C "$record" rm -rfq --cached . && git -C "$record" clean -fdq
            fi
            mkdir -p "$record/telemetry"
            cat "$RUNNER_TEMP/new-rows.jsonl" >> "$record/telemetry/runs.jsonl"
            git -C "$record" add -f telemetry/runs.jsonl
            git -C "$record" commit -q -m "telemetry: factory tick $(date -u +%Y-%m-%dT%H:%M)"
            if git -C "$record" push -q origin HEAD:refs/heads/telemetry; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); the record moved, retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not persist telemetry after 5 attempts"
          exit 1
